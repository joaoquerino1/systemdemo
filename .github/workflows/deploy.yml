# =============================================================================
# SystemDemo - Deploy to Railway
# =============================================================================
# Deploys the backend API and frontend app to Railway on push to master.
# Requires RAILWAY_TOKEN, RAILWAY_API_SERVICE_ID and RAILWAY_APP_SERVICE_ID
# secrets (service IDs can be copied from the Railway dashboard/CLI).

name: Deploy to Railway

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend API to Railway
        working-directory: logistica-api
        run: railway up --service ${{ secrets.RAILWAY_API_SERVICE_ID }} --detach --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy frontend app to Railway
        working-directory: logistica-app
        run: railway up --service ${{ secrets.RAILWAY_APP_SERVICE_ID }} --detach --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}