gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# Template processed by the official nginx docker image entrypoint (envsubst).
# - PORT: Railway injects this (nginx must listen on it). Defaults to 80 locally.
# - BACKEND_INTERNAL_URL: base URL of the Spring Boot API. Locally it is
#   http://backend:8080; on Railway it points to the api service domain.
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy for the Spring Boot API
    location /api/ {
        proxy_pass ${BACKEND_INTERNAL_URL}/api/;
        # No Host override: nginx sends the upstream host by default, which is
        # required when the upstream is a Railway domain (the edge routes by Host).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Health check passthrough
    location /actuator/ {
        proxy_pass ${BACKEND_INTERNAL_URL}/actuator/;
    }

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}