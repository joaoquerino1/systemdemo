<h2 mat-dialog-title>Devolver "{{ ativo.nome }}"</h2>

<form [formGroup]="formulario" (ngSubmit)="confirmar()">
  <mat-dialog-content>
    @if (ativo.tipo === 'VEICULO') {
      <mat-form-field appearance="outline" class="campo-completo">
        <mat-label>KM de chegada</mat-label>
        <input matInput type="number" formControlName="kmChegada" />
      </mat-form-field>
    }

    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Observações (opcional)</mat-label>
      <textarea matInput formControlName="observacoes" rows="2"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Confirmar devolução</button>
  </mat-dialog-actions>
</form>
