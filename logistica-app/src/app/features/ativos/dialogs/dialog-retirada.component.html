<h2 mat-dialog-title>Retirar "{{ ativo.nome }}"</h2>

<form [formGroup]="formulario" (ngSubmit)="confirmar()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>ID do usuário que está retirando</mat-label>
      <input matInput type="number" formControlName="usuarioId" />
    </mat-form-field>

    @if (ativo.tipo === 'VEICULO') {
      <mat-form-field appearance="outline" class="campo-completo">
        <mat-label>KM de saída</mat-label>
        <input matInput type="number" formControlName="kmSaida" />
      </mat-form-field>
    }

    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Observações (opcional)</mat-label>
      <textarea matInput formControlName="observacoes" rows="2"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Confirmar retirada</button>
  </mat-dialog-actions>
</form>
