spring:
  application:
    name: systemdemo-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bravial_demo}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:producao}
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:producao}
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

springdoc:
  swagger-ui:
    path: ${SWAGGER_PATH:/docs}
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}

app:
  jwt:
    secret: ${JWT_SECRET:systemdemo-secret-change-in-production-32ch}
    expiracao-horas: 8
  empresa:
    nome: ${EMPRESA_NOME:TechFrame Tecnologia Ltda}
    cnpj: ${EMPRESA_CNPJ:12.345.678/0001-90}
  cors:
    origens-permitidas: ${CORS_ORIGENS:http://localhost:4200}
  ratelimit:
    login-max-tentativas: ${RATE_LIMIT_LOGIN_MAX:5}
    login-janela-segundos: ${RATE_LIMIT_LOGIN_WINDOW:300}

---
spring:
  config:
    activate:
      on-profile: default
  jpa:
    show-sql: true
springdoc:
  api-docs:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    show-sql: false

app:
  jwt:
    secret: test-secret-for-e2e-only-minimum-32-chars-ok

---
spring:
  config:
    activate:
      on-profile: production
  jpa:
    show-sql: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    path: /disabled
