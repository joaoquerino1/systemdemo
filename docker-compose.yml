services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bravial_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bravial_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: logistica-api/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/bravial_demo
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-bravial-demo-secret-change-in-production-32ch}
      CORS_ORIGENS: http://localhost
      SPRING_PROFILES_ACTIVE: production
      EMPRESA_NOME: TechFrame Tecnologia Ltda
      EMPRESA_CNPJ: 12.345.678/0001-90
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: logistica-app/Dockerfile
      args:
        API_URL: http://localhost/api
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
